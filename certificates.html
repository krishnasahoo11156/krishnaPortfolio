<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications &amp; Credentials — Krishna Sahoo</title>
    <meta name="description" content="Technical certifications, courses, and credentials verifying expertise in Cloud Computing, AI/ML, and Software Engineering by Krishna Sahoo.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e8473f'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='14' fill='white'%3EKS%3C/text%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap&font-display=swap" rel="stylesheet">

    <!-- CSS Imports -->
    <link rel="stylesheet" href="css/variables.css?v=5">
    <link rel="stylesheet" href="css/base.css?v=5">
    <link rel="stylesheet" href="css/typography.css?v=5">
    <link rel="stylesheet" href="css/layout.css?v=5">
    <link rel="stylesheet" href="css/components.css?v=5">
    <link rel="stylesheet" href="css/polish.css?v=5">
    <link rel="stylesheet" href="css/detail.css?v=5">

    <style>
        .certs-detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
            gap: 2rem;
            margin-top: 3rem;
            margin-bottom: 5rem;
        }

        .cert-detail-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.25rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s var(--ease-smooth), box-shadow 0.3s var(--ease-smooth), border-color 0.3s var(--ease-smooth);
            box-shadow: 0 8px 30px var(--card-shadow-main);
            cursor: pointer;
        }

        .cert-detail-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 15px 35px var(--card-shadow-main), 0 0 15px var(--card-shadow-accent);
        }

        .cert-detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .cert-logo-container {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            transition: transform 0.3s ease;
        }

        .cert-detail-card:hover .cert-logo-container {
            transform: scale(1.08);
        }

        .cert-detail-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cert-status-badge {
            font-family: var(--font-body);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .cert-status-badge.active {
            border-color: rgba(34, 197, 94, 0.3);
            color: #22c55e;
            background: rgba(34, 197, 94, 0.04);
        }

        .cert-status-badge.completed {
            border-color: rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.04);
        }

        .cert-detail-tag {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .cert-detail-title {
            font-family: var(--font-heading);
            font-size: clamp(24px, 4vw, 32px);
            color: var(--text-primary);
            letter-spacing: 1px;
            line-height: 1.15;
            margin-bottom: 0.75rem;
        }

        .cert-detail-meta {
            font-family: var(--font-body);
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cert-meta-item strong {
            color: var(--text-primary);
        }

        .cert-detail-desc {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        /* Skills Tag list */
        .cert-skills-wrap {
            margin-top: auto;
            margin-bottom: 1.5rem;
        }

        .cert-skills-label {
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cert-skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .cert-skill-tag {
            font-family: var(--font-body);
            font-size: 11px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .cert-detail-card:hover .cert-skill-tag {
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Collapsible Syllabus Accordion */
        .cert-syllabus-accordion {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .cert-syllabus-summary {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
            user-select: none;
        }

        .cert-syllabus-summary::-webkit-details-marker {
            display: none;
        }

        .cert-syllabus-summary::after {
            content: "+";
            font-size: 16px;
            color: var(--text-tertiary);
            transition: transform 0.25s ease;
        }

        .cert-syllabus-accordion[open] .cert-syllabus-summary::after {
            content: "−";
            color: var(--accent-color);
        }

        .cert-syllabus-content {
            margin-top: 0.75rem;
            padding-left: 1rem;
            border-left: 2px solid var(--accent-color);
        }

        .cert-syllabus-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cert-syllabus-list li {
            font-family: var(--font-body);
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            position: relative;
        }

        .cert-syllabus-list li::before {
            content: "•";
            position: absolute;
            left: -12px;
            color: var(--accent-color);
        }

        /* Action buttons */
        .cert-verify-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            text-align: center;
        }

        .cert-verify-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(232, 71, 63, 0.04);
            box-shadow: 0 0 10px rgba(232, 71, 63, 0.08);
        }

        :root[data-theme="light"] .cert-detail-card {
            background: var(--surface-color);
        }

        :root[data-theme="light"] .cert-logo-container {
            background: rgba(0, 0, 0, 0.02);
        }

        :root[data-theme="light"] .cert-skill-tag {
            background: rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="detail-page-body">

    <!-- Custom Cursor (desktop) -->
    <div id="cursor-dot" aria-hidden="true"></div>
    <div id="cursor-ring" aria-hidden="true"></div>

    <!-- Scroll Progress Bar -->
    <div id="scroll-progress" aria-hidden="true"></div>

    <!-- Chat Widget Toggle Button -->
    <button id="chat-toggle" aria-label="Toggle Chat" class="cursor-hover">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path class="chat-path" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            <path class="close-path" d="M18 6L6 18M6 6l12 12" style="display: none;" />
        </svg>
    </button>

    <!-- Chat Widget Window -->
    <div id="chat-widget" role="dialog" aria-label="Krishna's Assistant Chat" aria-hidden="true">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-avatar">KS</div>
                <div class="chat-title-group">
                    <span class="chat-title">Krishna's Assistant</span>
                    <span class="chat-status">Online</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Messages -->
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be generated dynamically by JS -->
        </div>

        <!-- Suggested Questions -->
        <div class="chat-suggestions-container" id="chat-suggestions-container">
            <div class="chat-suggestions-inner" id="chat-suggestions">
                <!-- Suggestion chips will be populated here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-bar">
            <!-- Plus Button -->
            <button class="chat-plus-btn" id="chat-plus-btn" aria-label="Toggle detailed response">
                +
                <span class="chat-tooltip">Switch to Detailed Response</span>
            </button>
            
            <!-- Input Form wrapper -->
            <div class="chat-input-form">
                <input type="text" id="chat-input" class="chat-input" placeholder="Ask a question..." aria-label="Type your message">
                <!-- Voice Mic Button -->
                <button class="chat-mic-btn" id="chat-mic-btn" aria-label="Voice input">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
            </div>

            <!-- Send Button -->
            <button class="chat-send-btn" id="chat-send-btn" aria-label="Send message">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="detail-nav" role="navigation" aria-label="Main navigation">
        <a href="index.html" class="back-link" onclick="event.preventDefault(); navigateTo('index.html');">← Back to Home</a>
        <span class="nav-logo">KS</span>
        <div class="nav-right">
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light/dark theme" style="margin-right: 1rem; border-radius: 0;">
                <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#certificates">Certificates</a>
            <a href="index.html#contact">Contact</a>
        </div>
    </nav>

    <!-- HERO -->
    <header class="detail-hero">
        <div class="hero-inner">
            <h1 class="hero-title">CREDENTIALS</h1>
            <div class="hero-accent-line"></div>
            <p class="hero-subtitle">Validating technical capability, engineering excellence, and academic standards.</p>
        </div>
    </header>

    <!-- CERTIFICATIONS LIST -->
    <main class="section">
        <span class="section-label">Detailed Catalog</span>
        <h2 class="section-title">PROFESSIONAL LICENSES &amp; COURSES.</h2>

        <div class="certs-detail-grid">
            <!-- Dynamically populated by js/polish.js -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="detail-footer">
        <p>© 2026 Krishna Sahoo · <a href="index.html" onclick="event.preventDefault(); navigateTo('index.html');" style="color:var(--accent);">Back to Home</a></p>
    </footer>

    <!-- Script Imports -->
    <script src="js/main.js?v=5" defer></script>
    <script src="js/polish.js?v=5" defer></script>

    <!-- Page entry & exit transitions -->
    <script>
        window.addEventListener('load', function() {
            var o = document.createElement('div');
            o.style.cssText = 'position:fixed;inset:0;background:var(--bg-color);opacity:1;z-index:9999;transition:opacity 0.4s ease;pointer-events:none';
            document.body.appendChild(o);
            requestAnimationFrame(function() { requestAnimationFrame(function() { o.style.opacity = '0'; }); });
            setTimeout(function() { o.remove(); }, 500);
        });

        function navigateTo(url) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:var(--bg-color);opacity:0;z-index:9999;transition:opacity 0.3s ease;pointer-events:none';
            document.body.appendChild(overlay);
            requestAnimationFrame(function () { overlay.style.opacity = '1'; });
            setTimeout(function () { window.location.href = url; }, 320);
        }
    </script>
</body>
</html>
